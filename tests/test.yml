---
- hosts: localhost
  vars:
    clickhouse_report_db_host: "localhost"
    clickhouse_report_db_user: "root"
    clickhouse_report_db_password: "root"
    clickhouse_report_db_name: "test"
    clickhouse_report_local_dir: "/tmp/clickhouse-report"
    clickhouse_report_remote_storage: "s3"
    clickhouse_report_bucket_name: "clickhouse-reports"
    clickhouse_report_bucket_dir: "daily"
    clickhouse_report_bucket_dir_split_by_months: true
    clickhouse_report_use_compression: true
    clickhouse_report_delete_locally: true
    clickhouse_report_skip_when_delete_locally: 0

  roles:
    - { role: ../../clickhouse-report }
